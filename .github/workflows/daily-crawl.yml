name: daily-crawl

on:
  schedule:
    # 매일 18:00 UTC = 03:00 KST
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run daily crawl (artnet)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: |
          mkdir -p logs state
          set -o pipefail
          python -m src.run_daily --adapter artnet 2>&1 | tee -a logs/$(date +%Y-%m).jsonl
      - name: Commit state and logs
        if: always()
        run: |
          git config user.name "art-archive-bot"
          git config user.email "actions@github.com"
          git add state logs
          git diff --cached --quiet || git commit -m "chore(state): daily crawl $(date +%Y-%m-%d)"
          git push
